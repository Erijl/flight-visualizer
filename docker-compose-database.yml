version: '3.7'
services:

  mysql:
    image: mysql
    container_name: mysql
    volumes:
      - ./flightvisualizer-database-dump.sql:/docker-entrypoint-initdb.d/1.sql
      - ./flightvisualizer-database/config:/etc/mysql/conf.d
    environment:
      MYSQL_ROOT_PASSWORD: notUsingThisInProd
      MYSQL_DATABASE: flightvisualizer
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 30s
      retries: 10
